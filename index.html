<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cocora Chocolates — Menu</title>
<style>
  :root {
    --bg: #faf6f2;
    --card-bg: #ffffff;
    --border: #e8ddd4;
    --text-primary: #2b1d14;
    --text-secondary: #7a6a5c;
    --accent: #6b3f2a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
  }

  header {
    text-align: center;
    padding: 2rem 1rem 1rem;
  }

  header h1 {
    font-size: 1.6rem;
    font-weight: 600;
    margin: 0 0 0.25rem;
    letter-spacing: 0.02em;
  }

  header p {
    font-size: 0.9rem;
    color: var(--text-secondary);
    margin: 0;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 14px;
    padding: 1rem;
    max-width: 720px;
    margin: 0 auto;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .card:active {
    transform: scale(0.97);
  }

  .card-img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    background: var(--border);
    display: block;
  }

  .card-name {
    font-size: 0.85rem;
    font-weight: 600;
    text-align: center;
    padding: 10px 8px;
    margin: 0;
  }

  /* Full-screen detail overlay */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(20, 12, 8, 0.75);
    z-index: 100;
    align-items: flex-end;
    justify-content: center;
  }

  .overlay.open {
    display: flex;
  }

  .detail-sheet {
    background: var(--card-bg);
    width: 100%;
    max-width: 480px;
    border-radius: 20px 20px 0 0;
    max-height: 90vh;
    overflow-y: auto;
    animation: slideUp 0.25s ease;
  }

  @keyframes slideUp {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .detail-img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    display: block;
    background: var(--border);
  }

  .detail-body {
    padding: 1.25rem 1.5rem 2rem;
    position: relative;
  }

  .close-btn {
    position: absolute;
    top: -44px;
    right: 16px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,0.9);
    border: none;
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .detail-name {
    font-size: 1.3rem;
    font-weight: 700;
    margin: 0 0 4px;
  }

  .detail-price {
    font-size: 1rem;
    color: var(--accent);
    font-weight: 600;
    margin: 0 0 12px;
  }

  .detail-desc {
    font-size: 0.95rem;
    color: var(--text-secondary);
    line-height: 1.5;
    margin: 0 0 16px;
  }

  .fillings-label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-secondary);
    margin: 0 0 6px;
    border-top: 1px solid var(--border);
    padding-top: 14px;
  }

  .fillings-text {
    font-size: 0.95rem;
    margin: 0;
  }
</style>
</head>
<body>

<header>
  <h1>Cocora Chocolates</h1>
  <p>Tap a chocolate to see it up close</p>
</header>

<div class="grid" id="grid"></div>

<div class="overlay" id="overlay">
  <div class="detail-sheet">
    <button class="close-btn" id="closeBtn" aria-label="Close">✕</button>
    <img class="detail-img" id="detailImg" alt="">
    <div class="detail-body">
      <p class="detail-name" id="detailName"></p>
      <p class="detail-price" id="detailPrice"></p>
      <p class="detail-desc" id="detailDesc"></p>
      <p class="fillings-label">Fillings</p>
      <p class="fillings-text" id="detailFillings"></p>
    </div>
  </div>
</div>

<script>
  /*
    EDIT YOUR CHOCOLATES HERE.
    - image: path to a photo file, e.g. "images/dark-sea-salt.jpg"
      (put your photo files in an "images" folder next to this file)
    - name, price, desc, fillings: plain text
    Add or remove entries freely — the page updates automatically.
  */
  const chocolates = [
    {
      image: "images/placeholder.jpg",
      name: "Dark sea salt",
      price: "₱65",
      desc: "70% single-origin dark chocolate shell, hand finished with flaked sea salt.",
      fillings: "Salted caramel"
    },
    {
      image: "images/placeholder.jpg",
      name: "Coconut cream",
      price: "₱65",
      desc: "Milk chocolate shell with toasted coconut on top.",
      fillings: "Toasted coconut, white chocolate ganache"
    },
    {
      image: "images/placeholder.jpg",
      name: "Peanut crunch",
      price: "₱60",
      desc: "Milk chocolate shell, crushed peanuts on top.",
      fillings: "Peanut praline, crushed roasted peanuts"
    },
    {
      image: "images/placeholder.jpg",
      name: "Strawberry burst",
      price: "₱70",
      desc: "White chocolate shell with a freeze-dried strawberry garnish.",
      fillings: "Strawberry compote"
    },
    {
      image: "images/placeholder.jpg",
      name: "Mocha swirl",
      price: "₱70",
      desc: "Dark chocolate shell with a coffee bean garnish.",
      fillings: "Espresso ganache"
    },
    {
      image: "images/placeholder.jpg",
      name: "Orange zest",
      price: "₱65",
      desc: "Dark chocolate shell with candied orange peel on top.",
      fillings: "Candied orange, dark chocolate ganache"
    }
  ];

  const grid = document.getElementById('grid');
  const overlay = document.getElementById('overlay');
  const detailImg = document.getElementById('detailImg');
  const detailName = document.getElementById('detailName');
  const detailPrice = document.getElementById('detailPrice');
  const detailDesc = document.getElementById('detailDesc');
  const detailFillings = document.getElementById('detailFillings');
  const closeBtn = document.getElementById('closeBtn');

  chocolates.forEach((c, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <img class="card-img" src="${c.image}" alt="${c.name}" loading="lazy">
      <p class="card-name">${c.name}</p>
    `;
    card.addEventListener('click', () => openDetail(i));
    grid.appendChild(card);
  });

  function openDetail(i) {
    const c = chocolates[i];
    detailImg.src = c.image;
    detailImg.alt = c.name;
    detailName.textContent = c.name;
    detailPrice.textContent = c.price;
    detailDesc.textContent = c.desc;
    detailFillings.textContent = c.fillings;
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeDetail() {
    overlay.classList.remove('open');
    document.body.style.overflow = '';
  }

  closeBtn.addEventListener('click', closeDetail);
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeDetail();
  });
</script>

</body>
</html>
